# Configuration Streamlit — Rondol (thème sombre industriel cohérent avec l'app).
# N'affecte aucun calcul : uniquement l'apparence de base et la télémétrie.

[theme]
base = "dark"
primaryColor = "#4CAF50"
backgroundColor = "#0B0F14"
secondaryBackgroundColor = "#111827"
textColor = "#F9FAFB"

[browser]
gatherUsageStats = false
